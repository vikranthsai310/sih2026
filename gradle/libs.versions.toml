# Every version pinned. No dynamic ranges -- a build that resolves differently
# on two machines cannot produce comparable benchmark figures.
[versions]
agp             = "8.7.3"
kotlin          = "2.0.21"
coroutines      = "1.9.0"
composeBom      = "2024.10.01"
activityCompose = "1.9.3"
lifecycle       = "2.8.7"
datastore       = "1.1.1"
room            = "2.6.1"
ksp             = "2.0.21-1.0.25"
sherpaOnnx      = "1.13.2"
zxing           = "3.5.3"
junit           = "4.13.2"
kotest          = "5.9.1"
androidxTest    = "1.6.1"
espresso        = "3.6.1"
ktlint          = "12.1.1"
kover           = "0.8.3"

[libraries]
kotlin-coroutines      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
compose-bom            = { module = "androidx.compose:compose-bom",     version.ref = "composeBom" }
compose-ui             = { module = "androidx.compose.ui:ui" }
compose-material3      = { module = "androidx.compose.material3:material3" }
compose-tooling        = { module = "androidx.compose.ui:ui-tooling" }
activity-compose       = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-service      = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
datastore-prefs        = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room-runtime           = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx               = { module = "androidx.room:room-ktx",     version.ref = "room" }
room-compiler          = { module = "androidx.room:room-compiler", version.ref = "room" }
sherpa-onnx            = { module = "com.k2fsa.sherpa.onnx:sherpa-onnx-android", version.ref = "sherpaOnnx" }
zxing-core             = { module = "com.google.zxing:core", version.ref = "zxing" }
junit                  = { module = "junit:junit", version.ref = "junit" }
kotest-property        = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-assertions      = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
androidx-junit         = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }
espresso-core          = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint              = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover               = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
