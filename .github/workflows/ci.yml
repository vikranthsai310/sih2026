name: CI
on: [push, pull_request]

jobs:
  # core-proto needs no Android SDK, so the highest-risk code gets the fastest
  # feedback. This job must stay under a minute.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core-proto:test :core-proto:ktlintCheck :core-proto:koverVerify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lint test

  # Constraint C2 is enforced here, not trusted.
  manifest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No INTERNET or location permission may ever ship
        run: |
          if grep -qE 'permission.INTERNET|ACCESS_(FINE|COARSE)_LOCATION' app/src/main/AndroidManifest.xml; then
            echo "::error::The offline claim is platform-enforced. Remove the permission."
            exit 1
          fi
          echo "manifest clean"

  # Risk P-04: a dependency absent from LICENSES.md fails the build.
  licence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every catalog library must appear in LICENSES.md
        run: python tools/check_licences.py

  # W1.10: key material must never reach a diff. Risk S-04.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No keystore, key or credential in the tree
        run: |
          if git ls-files | grep -nE '\.(jks|keystore|p12|pem)$|keystore\.properties|secrets\.properties'; then
            echo "::error::Signing or key material is tracked. Remove it and rotate."
            exit 1
          fi
          if git grep -nIE 'BEGIN (RSA |EC )?PRIVATE KEY|aead[Kk]ey *= *"' -- ':!docs' ':!*.md'; then
            echo "::error::A literal key appears in the source."
            exit 1
          fi
          echo "secret scan clean"
